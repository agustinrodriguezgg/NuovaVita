<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Nuova Vita</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="login-page d-flex align-items-center min-vh-100 py-4">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-8">

        <div class="card login-card border-0 overflow-hidden">
          <div class="row g-0">
            <section class="col-md-5 login-panel d-flex flex-column justify-content-center p-4 p-lg-5 text-center text-md-start">
              <a href="index.html" class="logo d-inline-flex align-items-center gap-2 text-decoration-none mb-4 mx-auto mx-md-0">
                <img src="img/logo.svg" alt="Logo de Nuova Vita" width="40" height="40">
                <span class="fw-semibold fs-5">Nuova Vita</span>
              </a>
              <h2 class="h3 mb-3">Bienvenido de nuevo</h2>
              <p class="mb-0">Ingresá con tus credenciales para acceder al sistema de gestión.</p>
            </section>

            <section class="col-md-7 bg-white p-4 p-lg-5">
              <form class="login-form" aria-label="Formulario de inicio de sesión" novalidate>
                <h1 class="h3 mb-4">Iniciar Sesión</h1>

                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="nombre@nuovavita.com" required>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" name="password" placeholder="********" required>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="recordar" id="recordar">
                    <label class="form-check-label" for="recordar">Recordarme</label>
                  </div>
                  <a href="#" class="login-link small">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
              </form>

              <a href="index.html" class="login-link d-inline-block mt-4">&larr; Volver al inicio</a>
            </section>

          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
